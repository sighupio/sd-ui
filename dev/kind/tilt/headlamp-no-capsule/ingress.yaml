# Dev copy of module-utilities examples/oidc-rbac/ingress.yaml (kustomize forbids referencing a raw
# file outside the overlay root, so it is duplicated here rather than referenced).
# The host is overwritten by patch-ingress-host.yaml (generated from the .tpl).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: pomerium
  labels:
    cluster.kfd.sighup.io/useful-link.enable: "true"
  annotations:
    cluster.kfd.sighup.io/useful-link.url: https://headlamp.example.com
    cluster.kfd.sighup.io/useful-link.name: "Headlamp"
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/appName: "Headlamp"
    cert-manager.io/cluster-issuer: kind-ca
spec:
  ingressClassName: nginx
  rules:
    - host: headlamp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pomerium
                port:
                  number: 80
  tls:
    - hosts:
        - headlamp.example.com
      secretName: headlamp-tls
