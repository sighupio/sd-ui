# Allow Capsule users to get specific ingresses for sd-core plugin links
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sd-ingress-reader
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sd-ingress-reader
subjects:
  - kind: Group
    name: capsule.clastix.io
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sd-ingress-reader
---
# Allow Capsule users to proxy to Loki for sd-loki-events plugin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sd-loki-proxy
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["loki-stack", "loki-stack:3100"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sd-loki-proxy
subjects:
  - kind: Group
    name: capsule.clastix.io
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sd-loki-proxy
---
