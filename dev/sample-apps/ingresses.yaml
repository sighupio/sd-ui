apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-frontend
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - host: shop.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sock-shop-frontend
  namespace: sock-shop
spec:
  ingressClassName: nginx
  rules:
    - host: sock-shop.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-end
                port:
                  number: 80
