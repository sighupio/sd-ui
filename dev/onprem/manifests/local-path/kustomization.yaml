# Default StorageClass for the OnPremises dev environment: rancher local-path-provisioner
# (node-local hostPath volumes). OnPremises clusters ship without storage, and the logging,
# monitoring and dr modules need PersistentVolumes. Applied by startup.sh with kubectl
# between the kubernetes and the distribution phases.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/local-path-provisioner//deploy?ref=v0.0.37
patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
