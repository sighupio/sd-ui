# ClusterIssuer signing every ingress certificate with the environment's own CA
# (dev/onprem/state/certs). The keypair secret is created by startup.sh before the
# distribution phase, so cert-manager can use it as soon as it is installed.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuer.yaml
