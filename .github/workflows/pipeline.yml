name: SD-UI CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'

permissions:
  contents: read

env:
  REGISTRY: registry.sighup.io
  IMAGE_NAME: fury/sd-ui

jobs:
  # ============================================
  # PHASE 0: DISCOVER PLUGINS FOR MATRIX
  # ============================================
  prepare:
    name: Discover plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.set-matrix.outputs.plugins }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate plugin matrix
        id: set-matrix
        run: |
          # List sd-* plugin basenames (excludes headlamp-reevo-theme which is pre-built)
          plugins=$(ls -d plugins/sd-*/ | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> $GITHUB_OUTPUT
          echo "Discovered plugins: $plugins"

  # ============================================
  # PHASE 1: LINT (parallel per plugin)
  # ============================================
  lint:
    name: Lint ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json

      - name: Install dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: npm ci

      - name: Type-check
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run tsc

      - name: Lint
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run lint

      # TODO: uncomment when unit tests are added
      # - name: Test
      #   working-directory: plugins/${{ matrix.plugin }}
      #   run: npm run test

  # ============================================
  # PHASE 2: BUILD THE IMAGE (every push), PUSH IT (tags only)
  # ============================================
  # The Dockerfile compiles the plugins from source (plugins-build stage), so the image
  # always matches the commit: there are no build artifacts in git or between jobs.
  build-and-push-image:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Build and Push SD-UI Image' || 'Build SD-UI Image' }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - # Add support for building the arm64 image with QEMU emulation on the amd64 runner.
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') }}
            type=sha,format=long,prefix=

      - name: ${{ startsWith(github.ref, 'refs/tags/') && 'Build and push multi-arch image' || 'Build multi-arch image (no push)' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # PHASE 3: RELEASE (only runs for tags)
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if release notes file exists
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_path=${NOTES_FILE}" >> $GITHUB_OUTPUT
            echo "Found release notes: ${NOTES_FILE}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Release notes file not found: ${NOTES_FILE}"
            echo "Will use auto-generated release notes instead"
          fi

      - name: Prepare Docker images information
        id: docker_info
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          {
            printf '\n---\n\n## Docker Images\n\nThis release is available as a Docker image:\n\n'
            printf -- '- `%s:%s`\n' "$IMAGE" "$VERSION"
            # `latest` is pushed for stable releases only
            [[ "$VERSION" == *-rc* ]] || printf -- '- `%s:latest`\n' "$IMAGE"
            printf -- '- `%s:%s`\n' "$IMAGE" "${{ github.sha }}"
          } > /tmp/docker-images.md
          echo "docker_images_file=/tmp/docker-images.md" >> $GITHUB_OUTPUT

      - name: Combine release notes with Docker images
        if: steps.release_notes.outputs.exists == 'true'
        run: |
          cat "${{ steps.release_notes.outputs.file_path }}" > /tmp/final-release-notes.md
          cat "${{ steps.docker_info.outputs.docker_images_file }}" >> /tmp/final-release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ contains(steps.version.outputs.VERSION, '-rc') && format('Preview {0}', steps.version.outputs.VERSION) || format('Release {0}', steps.version.outputs.VERSION) }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') }}
          body_path: ${{ steps.release_notes.outputs.exists == 'true' && '/tmp/final-release-notes.md' || steps.docker_info.outputs.docker_images_file }}
          generate_release_notes: ${{ steps.release_notes.outputs.exists == 'false' }}
          append_body: ${{ steps.release_notes.outputs.exists == 'false' }}
